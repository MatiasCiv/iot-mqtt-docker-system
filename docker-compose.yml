services:
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "1883"]

      #test: ["CMD-SHELL", "mosquitto_sub -t '$$sys/test' -E -i test_hc -c 1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  ble-service:
    build: ./ble-service
    container_name: ble-service
    restart: unless-stopped
    privileged: true 
    volumes:
      - /dev:/dev:ro 
    stop_grace_period: 3s 
    depends_on:
      mqtt: #  ¡Corregido! Sin guion
        condition: service_healthy

  backend:
    build: ./backend
    container_name: backend
    depends_on:
      mqtt: #  ¡Corregido! Sin guion
        condition: service_healthy 
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000  # 🔥 FUERZA A .NET A ESCUCHAR EN EL PUERTO 5000
      - ASPNETCORE_ENVIRONMENT=Development   # Te dará logs detallados en la consola si falla

    volumes:
      - ./data:/app/data
    restart: unless-stopped
