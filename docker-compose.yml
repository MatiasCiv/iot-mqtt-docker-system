services:
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped # 🔥 Cambiado para que sobreviva a reinicios

  ble-service:
    build: ./ble-service
    container_name: ble-service
    restart: unless-stopped
    privileged: true 
    volumes:
      - /dev:/dev:ro 
    stop_grace_period: 3s 
    depends_on:
      - mqtt


  backend:
    build: ./backend
    container_name: backend
    depends_on:
      - mqtt       
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped # 🔥 Cambiado para producción