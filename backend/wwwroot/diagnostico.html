<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico BLE - Sistema IoT</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #121214; color: #e1e1e6; margin: 20px; }
        h1 { color: #4ade80; border-bottom: 2px solid #202024; padding-bottom: 10px; }
        .grid { width: 100%; border-collapse: collapse; margin-top: 20px; background: #202024; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #29292e; }
        th { background: #29292e; color: #4ade80; text-transform: uppercase; font-size: 12px; }
        tr:hover { background: #2a2a30; }
        .rssi-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .signal-good { background: #15803d; color: #bbf7d0; }
        .signal-medium { background: #854d0e; color: #fef08a; }
        .signal-bad { background: #991b1b; color: #fecaca; }
        .manu-data { font-family: monospace; color: #a1a1aa; font-size: 13px; word-break: break-all; }
    </style>
</head>
<body>

    <h1>📡 Panel de Diagnóstico BLE en Tiempo Real</h1>
    <p>Escaneando el entorno desde la Raspberry Pi 4. Datos consultados desde SQLite.</p>

    <table class="grid">
        <thead>
            <tr>
                <th>Dirección MAC</th>
                <th>Nombre del Dispositivo</th>
                <th>Señal (RSSI)</th>
                <th>Manufacturer Data (Payload Hex)</th>
                <th>Última actualización</th>
            </tr>
        </thead>
        <tbody id="dispositivos-lista">
        </tbody>
    </table>

    <script>
        async function cargarDiagnostico() {
            try {
                // Petición HTTP directa al endpoint que ya tenías en C#
                const respuesta = await fetch('/api/diagnostico');
                const logs = await respuesta.json();

                renderizarTabla(logs);
            } catch (error) {
                console.error("Error al obtener los logs de diagnóstico:", error);
            }
        }

        function renderizarTabla(logs) {
            const tbody = document.getElementById('dispositivos-lista');
            tbody.innerHTML = '';

            // Agrupar en el cliente para mostrar solo el registro más reciente de cada MAC
            const ultimosPorMac = {};
            logs.forEach(log => {
                if (!ultimosPorMac[log.mac]) {
                    ultimosPorMac[log.mac] = log;
                }
            });

            // Convertir a array y ordenar por la mejor señal (RSSI)
            const dispositivos = Object.values(ultimosPorMac).sort((a, b) => b.rssi - a.rssi);

            dispositivos.forEach(dev => {
                let rssiClass = 'signal-good';
                if (dev.rssi < -80) rssiClass = 'signal-bad';
                else if (dev.rssi < -65) rssiClass = 'signal-medium';

                const fecha = new Date(dev.fechaCaptura + "Z").toLocaleTimeString();

                const row = `
                    <tr>
                        <td style="font-weight: bold; color: #60a5fa;">${dev.mac}</td>
                        <td>${dev.nombre || 'Desconocido'}</td>
                        <td><span class="rssi-badge ${rssiClass}">${dev.rssi} dBm</span></td>
                        <td class="manu-data">${dev.manufacturerData && dev.manufacturerData !== '{}' ? dev.manufacturerData : '<span style="color:#52525b;">Ninguno</span>'}</td>
                        <td style="color: #71717a; font-size: 13px;">${fecha}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // Refrescar automáticamente cada 3 segundos
        setInterval(cargarDiagnostico, 3000);
        cargarDiagnostico();
    </script>
</body>
</html>
